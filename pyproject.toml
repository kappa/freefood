[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freefood"
version = "0.1.0"
description = "Console client for FreeFeed.net"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Alex Kapranoff", email = "kapranoff@gmail.com" }
]
dependencies = [
    "textual>=0.47",
    "httpx>=0.27",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "pyinstaller>=6.0",
]

[project.scripts]
freefood = "freefood.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["freefood"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=freefood"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 95

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

# Textual's Screen.app returns App[Any], so mypy can't see FreeFoodApp's
# custom attributes (state, api). Suppress until we restructure to break
# the circular import between app.py and screens.
[[tool.mypy.overrides]]
module = [
    "freefood.screens.feed",
    "freefood.screens.errors",
    "freefood.screens.search",
    "freefood.screens.post",
    "freefood.screens.notifications",
]
disable_error_code = ["attr-defined", "no-any-return"]
