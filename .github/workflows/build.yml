name: Build Executables

on:
  workflow_dispatch:  # Manual trigger
  push:
    tags:
      - 'v*'  # Trigger on version tags

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: freefood
            asset_name: freefood-linux-x86_64
          - os: macos-12
            artifact_name: freefood
            asset_name: freefood-macos-x86_64
          - os: macos-14
            artifact_name: freefood
            asset_name: freefood-macos-arm64
          - os: windows-latest
            artifact_name: freefood.exe
            asset_name: freefood-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build executable
        run: |
          pyinstaller freefood.spec --distpath dist --workpath build --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}
          retention-days: 90
